<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" width="460" height="290">
  <rect width="460" height="290" fill="#FFFFFF"/>
  <text x="230" y="20" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-size="13.5" font-weight="700">Figure (X)</text>

  <!-- Figure X: W inside square -->
  <g transform="translate(185,28)">
    <rect width="90" height="90" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <polyline points="16,14 31,74 45,42 59,74 74,14" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="16" y="148" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700">Answer Figures:</text>

  <!-- (1): Complex square with diagonals & diamond -->
  <g transform="translate(22,160)">
    <rect width="94" height="94" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="12" y="12" width="70" height="70" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="12" y1="12" x2="82" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="82" y1="12" x2="12" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="47" y1="12" x2="47" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="12" y1="47" x2="82" y2="47" stroke="#0F172A" stroke-width="1.6"/>
    <polyline points="47,12 36,34 36,82" fill="none" stroke="#0F172A" stroke-width="1.6"/>
    <polyline points="47,12 58,34 58,82" fill="none" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="12" y1="47" x2="36" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="36" y1="82" x2="58" y2="58" stroke="#0F172A" stroke-width="1.6"/>
    <text x="47" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">(1)</text>
  </g>

  <!-- (2): Vertical stripes with main diagonal -->
  <g transform="translate(128,160)">
    <rect width="94" height="94" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="12" y="12" width="70" height="70" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="23.6" y1="12" x2="23.6" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="35.3" y1="12" x2="35.3" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="47" y1="12" x2="47" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="58.6" y1="12" x2="58.6" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="70.3" y1="12" x2="70.3" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="12" y1="12" x2="82" y2="82" stroke="#0F172A" stroke-width="1.8"/>
    <text x="47" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">(2)</text>
  </g>

  <!-- (3): Inverted trapezoid containing exact W + center vertical (Correct!) -->
  <g transform="translate(234,160)">
    <rect width="94" height="94" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <polygon points="10,14 84,14 66,80 28,80" fill="none" stroke="#0F172A" stroke-width="1.9" stroke-linejoin="round"/>
    <line x1="47" y1="14" x2="47" y2="80" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="28" y1="80" x2="64" y2="14" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="66" y1="80" x2="30" y2="14" stroke="#0F172A" stroke-width="1.8"/>
    <text x="47" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">(3)</text>
  </g>

  <!-- (4): Square with star diagonals and upper V notches -->
  <g transform="translate(340,160)">
    <rect width="94" height="94" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="12" y="12" width="70" height="70" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <line x1="12" y1="12" x2="82" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="82" y1="12" x2="12" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="47" y1="12" x2="47" y2="82" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="12" y1="47" x2="82" y2="47" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="36" y1="12" x2="29" y2="29" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="58" y1="12" x2="65" y2="29" stroke="#0F172A" stroke-width="1.6"/>
    <text x="47" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">(4)</text>
  </g>
</svg>
