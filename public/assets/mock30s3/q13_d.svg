    <g transform="translate(142, 46) scale(-1, 1)"><text x="0" y="0">W</text></g>
    <g transform="translate(202, 46) scale(-1, 1)"><text x="0" y="0">5</text></g>
    <g transform="translate(250, 42) scale(-1, 1)"><text x="0" y="0">j</text></g>
    <g transform="translate(286, 46) scale(-1, 1)"><text x="0" y="0">f</text></g>
