<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <rect width="360" height="220" fill="#FFFFFF" />
  <defs>
    <pattern id="mirrorHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#111827" stroke-width="3.2" />
    </pattern>
  </defs>

  <!-- Characters f j 5 W 2 r -->
  <g fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="44" text-anchor="middle">
    <text x="38" y="124">f</text>
    <text x="74" y="124">j</text>
    <text x="118" y="124">5</text>
    <text x="174" y="124">W</text>
    <text x="230" y="124">2</text>
    <text x="272" y="124">r</text>
  </g>

  <!-- Mirror Line PQ -->
  <text x="314" y="42" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" text-anchor="middle">P</text>
  <line x1="305" y1="52" x2="305" y2="176" stroke="#0F172A" stroke-width="3.5" stroke-linecap="square" />
  <rect x="306.5" y="52" width="16" height="124" fill="url(#mirrorHatch)" />
  <text x="314" y="207" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" text-anchor="middle">Q</text>
</svg>
