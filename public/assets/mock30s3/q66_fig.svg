<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370">
  <rect width="640" height="370" fill="#FFFFFF" />

  <!-- Title -->
  <text x="335" y="34" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Sizes of Apartments Sold (Sq Meters)</text>

  <!-- Horizontal Gridlines (y = 0 to 70; plot top=64, bottom=288, height=224 => 3.2px per unit) -->
  <g stroke="#9CA3AF" stroke-width="1">
    <line x1="80" y1="64" x2="612" y2="64" />
    <line x1="80" y1="96" x2="612" y2="96" />
    <line x1="80" y1="128" x2="612" y2="128" />
    <line x1="80" y1="160" x2="612" y2="160" />
    <line x1="80" y1="192" x2="612" y2="192" />
    <line x1="80" y1="224" x2="612" y2="224" />
    <line x1="80" y1="256" x2="612" y2="256" />
  </g>
  <!-- Baseline -->
  <line x1="80" y1="288" x2="612" y2="288" stroke="#1F2937" stroke-width="1.6" />

  <!-- Y-Axis Labels -->
  <g fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="end">
    <text x="68" y="69">70</text>
    <text x="68" y="101">60</text>
    <text x="68" y="133">50</text>
    <text x="68" y="165">40</text>
    <text x="68" y="197">30</text>
    <text x="68" y="229">20</text>
    <text x="68" y="261">10</text>
    <text x="68" y="293">0</text>
  </g>

  <!-- Y-Axis Title -->
  <text x="24" y="176" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 24 176)">Number of Units Sold</text>

  <!-- X-Axis Labels (8 intervals spaced by 66.5px starting at x=113) -->
  <g fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="113" y="312">20-40</text>
    <text x="180" y="312">40-60</text>
    <text x="246" y="312">60-80</text>
    <text x="313" y="312">80-100</text>
    <text x="379" y="312">100-120</text>
    <text x="446" y="312">120-140</text>
    <text x="512" y="312">140-160</text>
    <text x="579" y="312">160-180</text>
  </g>

  <!-- X-Axis Title -->
  <text x="346" y="346" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Living Area (Square Meters)</text>

  <!-- Frequency Polygon Polyline -->
  <!-- y = 288 - val * 3.2: 0->288, 22->217.6, 42->153.6, 60->96, 37->169.6, 21->220.8, 7->265.6, 0->288 -->
  <polyline
    fill="none"
    stroke="#111827"
    stroke-width="2.8"
    stroke-linejoin="round"
    points="113,288 180,217.6 246,153.6 313,96 379,169.6 446,220.8 512,265.6 579,288"
  />

  <!-- Data Points -->
  <g fill="#111827">
    <circle cx="113" cy="288" r="4.5" />
    <circle cx="180" cy="217.6" r="4.5" />
    <circle cx="246" cy="153.6" r="4.5" />
    <circle cx="313" cy="96" r="4.5" />
    <circle cx="379" cy="169.6" r="4.5" />
    <circle cx="446" cy="220.8" r="4.5" />
    <circle cx="512" cy="265.6" r="4.5" />
    <circle cx="579" cy="288" r="4.5" />
  </g>

  <!-- Value Labels -->
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="113" y="274">0</text>
    <text x="180" y="203">22</text>
    <text x="246" y="139">42</text>
    <text x="313" y="82">60</text>
    <text x="379" y="155">37</text>
    <text x="446" y="206">21</text>
    <text x="512" y="251">7</text>
    <text x="579" y="274">0</text>
  </g>
</svg>
