<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370">
  <rect width="600" height="370" fill="#FFFFFF" />
  <defs>
    <!-- Tropical Evergreen 30%: checkerboard -->
    <pattern id="patEvergreen" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#FFFFFF" />
      <rect x="0" y="0" width="6" height="6" fill="#4B5563" />
      <rect x="6" y="6" width="6" height="6" fill="#4B5563" />
    </pattern>
    <!-- Deciduous 35%: wide square grid -->
    <pattern id="patDeciduous" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#FFFFFF" />
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#374151" stroke-width="1.2" />
    </pattern>
    <!-- Mangrove 10%: tight grid -->
    <pattern id="patMangrove" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#FFFFFF" />
      <path d="M 7 0 L 0 0 0 7" fill="none" stroke="#374151" stroke-width="1.1" />
    </pattern>
    <!-- Alpine 15%: horizontal dashed waves -->
    <pattern id="patAlpine" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="12" height="8" fill="#FFFFFF" />
      <path d="M 1 4 Q 3 2 6 4 T 11 4" fill="none" stroke="#4B5563" stroke-width="1.1" />
    </pattern>
    <!-- Scrub 10%: dark fill with light dots -->
    <pattern id="patScrub" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#374151" />
      <circle cx="4" cy="4" r="1.2" fill="#FFFFFF" />
    </pattern>
  </defs>

  <!-- Title -->
  <text x="300" y="34" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Share (%)</text>

  <!-- Pie Center (300, 198), Radius = 132 -->
  <!-- Angles clockwise from 12 o'clock (-90°):
       Tropical Evergreen 30% = 108° => -90° to 18°: (300, 66) to (425.54, 238.79)
       Deciduous 35% = 126° => 18° to 144°: (425.54, 238.79) to (193.21, 275.59)
       Mangrove 10% = 36° => 144° to 180°: (193.21, 275.59) to (168, 198)
       Alpine 15% = 54° => 180° to 234°: (168, 198) to (222.41, 91.21)
       Scrub 10% = 36° => 234° to 270°: (222.41, 91.21) to (300, 66)
  -->
  <g stroke="#111827" stroke-width="1.6" stroke-linejoin="round">
    <path d="M 300 198 L 300 66 A 132 132 0 0 1 425.54 238.79 Z" fill="url(#patEvergreen)" />
    <path d="M 300 198 L 425.54 238.79 A 132 132 0 0 1 193.21 275.59 Z" fill="url(#patDeciduous)" />
    <path d="M 300 198 L 193.21 275.59 A 132 132 0 0 1 168 198 Z" fill="url(#patMangrove)" />
    <path d="M 300 198 L 168 198 A 132 132 0 0 1 222.41 91.21 Z" fill="url(#patAlpine)" />
    <path d="M 300 198 L 222.41 91.21 A 132 132 0 0 1 300 66 Z" fill="url(#patScrub)" />
  </g>

  <!-- Leader Lines -->
  <g fill="none" stroke="#374151" stroke-width="1.2">
    <!-- Tropical Evergreen -->
    <polyline points="407,120 434,124 446,124" />
    <!-- Deciduous -->
    <polyline points="325,328 424,322 436,322" />
    <!-- Mangrove -->
    <polyline points="174,239 152,243 140,243" />
    <!-- Alpine -->
    <polyline points="183,138 148,154 136,154" />
    <!-- Scrub -->
    <polyline points="259,73 190,46 178,46" />
  </g>

  <!-- Labels -->
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">
    <text x="502" y="108">Tropical</text>
    <text x="502" y="127">Evergreen</text>
    <text x="502" y="146">30%</text>

    <text x="488" y="320">Deciduous</text>
    <text x="488" y="339">35%</text>

    <text x="92" y="242">Mangrove</text>
    <text x="92" y="261">10%</text>

    <text x="98" y="152">Alpine</text>
    <text x="98" y="171">15%</text>

    <text x="148" y="45">Scrub</text>
    <text x="148" y="64">10%</text>
  </g>
</svg>
