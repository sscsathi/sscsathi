<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#FFFFFF" />

  <!-- Title -->
  <text x="348" y="30" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">EV Production vs ICE Production</text>

  <!-- Plot Box: x=82..616 (w=534), y=44..358 (h=314); y=0 at 358, y=190 at 44 => scale 1.6px per unit (175 -> 78) -->
  <rect x="82" y="44" width="534" height="314" fill="#FFFFFF" stroke="#111827" stroke-width="1.4" />

  <!-- Y-Axis Ticks & Labels (0 to 175 step 25) -->
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="end">
    <line x1="76" y1="358" x2="82" y2="358" stroke="#111827" stroke-width="1.3" /><text x="71" y="363">0</text>
    <line x1="76" y1="318" x2="82" y2="318" stroke="#111827" stroke-width="1.3" /><text x="71" y="323">25</text>
    <line x1="76" y1="278" x2="82" y2="278" stroke="#111827" stroke-width="1.3" /><text x="71" y="283">50</text>
    <line x1="76" y1="238" x2="82" y2="238" stroke="#111827" stroke-width="1.3" /><text x="71" y="243">75</text>
    <line x1="76" y1="198" x2="82" y2="198" stroke="#111827" stroke-width="1.3" /><text x="71" y="203">100</text>
    <line x1="76" y1="158" x2="82" y2="158" stroke="#111827" stroke-width="1.3" /><text x="71" y="163">125</text>
    <line x1="76" y1="118" x2="82" y2="118" stroke="#111827" stroke-width="1.3" /><text x="71" y="123">150</text>
    <line x1="76" y1="78" x2="82" y2="78" stroke="#111827" stroke-width="1.3" /><text x="71" y="83">175</text>
  </g>

  <!-- Y-Axis Title -->
  <text x="24" y="201" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 24 201)">Production (in thousands)</text>

  <!-- Grouped Bars: barWidth=62 each -->
  <!-- 2023 centered at x=171: EV=40 (h=64, y=294), ICE=160 (h=256, y=102) -->
  <rect x="109" y="294" width="62" height="64" fill="#111827" stroke="#111827" stroke-width="1.2" />
  <rect x="171" y="102" width="62" height="256" fill="#9CA3AF" stroke="#111827" stroke-width="1.3" />

  <!-- 2024 centered at x=349: EV=70 (h=112, y=246), ICE=140 (h=224, y=134) -->
  <rect x="287" y="246" width="62" height="112" fill="#111827" stroke="#111827" stroke-width="1.2" />
  <rect x="349" y="134" width="62" height="224" fill="#9CA3AF" stroke="#111827" stroke-width="1.3" />

  <!-- 2025 centered at x=527: EV=112 (h=179.2, y=178.8), ICE=120 (h=192, y=166) -->
  <rect x="465" y="178.8" width="62" height="179.2" fill="#111827" stroke="#111827" stroke-width="1.2" />
  <rect x="527" y="166" width="62" height="192" fill="#9CA3AF" stroke="#111827" stroke-width="1.3" />

  <!-- Value Labels -->
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="140" y="286">40</text>
    <text x="202" y="94">160</text>
    <text x="318" y="238">70</text>
    <text x="380" y="126">140</text>
    <text x="496" y="171">112</text>
    <text x="558" y="158">120</text>
  </g>

  <!-- X-Axis Ticks & Labels -->
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">
    <line x1="171" y1="358" x2="171" y2="364" stroke="#111827" stroke-width="1.3" /><text x="171" y="381">2023</text>
    <line x1="349" y1="358" x2="349" y2="364" stroke="#111827" stroke-width="1.3" /><text x="349" y="381">2024</text>
    <line x1="527" y1="358" x2="527" y2="364" stroke="#111827" stroke-width="1.3" /><text x="527" y="381">2025</text>
    <text x="349" y="405" font-size="14" font-weight="700">Year</text>
  </g>

  <!-- Legend Box -->
  <g>
    <rect x="468" y="54" width="138" height="48" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.1" />
    <rect x="478" y="63" width="24" height="11" fill="#111827" stroke="#111827" stroke-width="1" />
    <text x="510" y="73" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600">EV Production</text>
    <rect x="478" y="82" width="24" height="11" fill="#9CA3AF" stroke="#111827" stroke-width="1.1" />
    <text x="510" y="92" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600">ICE Production</text>
  </g>
</svg>
