<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 132" width="440" height="132">
  <rect width="440" height="132" fill="#FFFFFF"/>
  <!-- (A): Square outside (4), Pentagon inside (5) -->
  <g transform="translate(12, 10)">
    <rect x="0" y="0" width="98" height="92" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
    <rect x="22" y="19" width="54" height="54" fill="none" stroke="#0F172A" stroke-width="2.4"/>
    <polygon points="49,31 64,42 58,60 40,60 34,42" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="49" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">(A)</text>
  </g>
  <!-- (B): Triangle outside (3), Square inside (4) -->
  <g transform="translate(118, 10)">
    <rect x="0" y="0" width="98" height="92" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
    <polygon points="49,16 17,74 81,74" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linejoin="round"/>
    <rect x="38" y="47" width="22" height="22" fill="none" stroke="#0F172A" stroke-width="2.2"/>
    <text x="49" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">(B)</text>
  </g>
  <!-- (C): Pentagon outside (5), Hexagon inside (6) -->
  <g transform="translate(224, 10)">
    <rect x="0" y="0" width="98" height="92" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
    <polygon points="49,15 74,38 74,74 24,74 24,38" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="49,31 61,40 61,57 49,66 37,57 37,40" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="49" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">(C)</text>
  </g>
  <!-- (D): Rhombus outside (4), Triangle inside (3) [ODD ONE OUT] -->
  <g transform="translate(330, 10)">
    <rect x="0" y="0" width="98" height="92" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
    <polygon points="49,14 81,46 49,78 17,46" fill="none" stroke="#0F172A" stroke-width="2.4" stroke-linejoin="round"/>
    <polygon points="49,33 36,55 62,55" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="49" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">(D)</text>
  </g>
</svg>
