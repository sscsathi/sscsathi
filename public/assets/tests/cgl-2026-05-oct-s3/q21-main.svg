<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" fill="#FFFFFF"/>
  <!-- Outer Square & Centerlines -->
  <rect x="10" y="10" width="200" height="200" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.6"/>
  <line x1="110" y1="10" x2="110" y2="210" stroke="#0F172A" stroke-width="2.4"/>
  <line x1="10" y1="110" x2="210" y2="110" stroke="#0F172A" stroke-width="2.4"/>
  <!-- 3/4 Outer Circle (missing bottom-right quadrant) -->
  <path d="M 110,196 A 86,86 0 1 1 196,110" fill="none" stroke="#0F172A" stroke-width="2.4"/>
  <!-- Top-Left Quadrant Petals -->
  <path d="M 24,110 Q 67,82 110,110" fill="none" stroke="#0F172A" stroke-width="2.3"/>
  <path d="M 110,24 Q 82,67 110,110" fill="none" stroke="#0F172A" stroke-width="2.3"/>
  <!-- Top-Right Quadrant Petals -->
  <path d="M 110,24 Q 138,67 110,110" fill="none" stroke="#0F172A" stroke-width="2.3"/>
  <path d="M 196,110 Q 153,82 110,110" fill="none" stroke="#0F172A" stroke-width="2.3"/>
  <!-- Bottom-Left Quadrant Petals -->
  <path d="M 24,110 Q 67,138 110,110" fill="none" stroke="#0F172A" stroke-width="2.3"/>
  <path d="M 110,196 Q 82,153 110,110" fill="none" stroke="#0F172A" stroke-width="2.3"/>
  <!-- Question Mark in Bottom-Right Quadrant -->
  <text x="160" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#0F172A">?</text>
</svg>
